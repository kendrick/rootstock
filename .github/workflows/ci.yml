# Runs the full suite on every pull request and on pushes to main. The order is
# cheapest-signal-first: a lint error should not wait behind a browser download.
#
# No OS or Node matrix. The only runtime this project targets is the static
# export served by Pages, and .nvmrc is the single version pin, so a matrix would
# buy variance rather than coverage.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version pin here: pnpm/action-setup reads it from package.json's
      # packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Lint CSS
        run: pnpm lint:css

      - name: Typecheck
        run: pnpm typecheck

      # Coverage is enabled in vitest.config.ts, so this step prints the summary
      # table under the results. Nothing in the job fails on that number—there
      # is no threshold, by design.
      - name: Test
        run: pnpm test

      # The Away Card's slug comes from a repository secret. The repo is public,
      # so a committed slug is a published one, which is the case ADR 0004
      # makes for the coordinates and applies just as well here. The build
      # fails without the variable rather than falling back to a default.
      #
      # `pretest:e2e` builds as well, so this step is redundant for the e2e run.
      # It stays because it is the only step that proves the build alone works,
      # and a broken build fails here with the compiler's own error, where a
      # Playwright webServer timeout would say only that the server never came up.
      - name: Build static export
        run: pnpm build
        env:
          ROOTSTOCK_AWAY_SLUG: ${{ secrets.ROOTSTOCK_AWAY_SLUG }}

      # Chromium only. The other engines are worth running locally before a
      # release; paying for three downloads on every push is not.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Chromium projects only, matching the single browser installed above.
      - name: End-to-end tests
        run: pnpm test:e2e --project=mobile-chrome --project=desktop-chrome
        # `pretest:e2e` runs `next build` and Playwright's webServer then runs
        # `pnpm preview`, which serves out/. The variable is still needed because
        # that build bakes the Away Card route; without it the build fails and
        # takes the whole job down instead of producing a failed assertion.
        env:
          ROOTSTOCK_AWAY_SLUG: ${{ secrets.ROOTSTOCK_AWAY_SLUG }}

      # The report is the only thing that explains a failed run after the
      # runner is gone.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
