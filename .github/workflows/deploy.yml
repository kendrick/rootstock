# Publishes the static export to GitHub Pages. Pages must be configured with
# "GitHub Actions" as its source in repo settings; this workflow cannot enable it.
#
# Deploys on push to main without re-running the full suite. ci.yml runs it against the same commit, and a second full run here would double the wait to publish. The one spec this workflow does run is the committed-Artifact check in the build job, for the reason given there.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys rather than cancelling them. A cancelled deploy leaves Pages on
# whatever shipped last, which is worse than waiting for the one in front.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The daily run pushes straight to main, so ci.yml and this workflow start on the same push and nothing here waits for CI. A malformed `data/artifact.json` doesn't fail `pnpm build`, because the Artifact gate parses it in the browser and renders its error state. Without this step, Pages would publish that error page. Failing here leaves Pages on the last good build.
      - name: Validate the committed Artifact
        run: pnpm exec vitest run --coverage.enabled=false src/artifact/committed-artifact.spec.ts

      # No base path to pass: next.config.ts sets it, so this is the same build
      # the suite already exercised.
      - name: Build static export
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # The Away Card's slug lives in a repository secret. ADR 0004 carries
          # the reasoning. The repo is public, and Pages publishes a public site
          # whatever the repo is, so a committed slug is one anyone can read. A
          # build without the variable fails rather than publishing the card
          # somewhere guessable.
          ROOTSTOCK_AWAY_SLUG: ${{ secrets.ROOTSTOCK_AWAY_SLUG }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
